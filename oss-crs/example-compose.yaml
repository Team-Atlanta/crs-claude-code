##############################################################################
#                        CRS Compose Configuration                           #
#              Example for crs-claude-code                              #
##############################################################################

# --- General Settings -------------------------------------------------------
run_env: local
docker_registry: local

# --- Infrastructure ---------------------------------------------------------
oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

# --- CRS (crs-claude-code) ---------------------------------------------
# Builder sidecars are declared in crs.yaml (snapshot: true / use_snapshot: true)
# and handled automatically by the framework — no separate entry needed.
crs-claude-code:
  source:
    local_path: /path/to/crs-claude-code            # UPDATE: local filesystem path
  cpuset: "2-7"                                     # UPDATE: available CPU cores
  memory: "16G"                                     # UPDATE: available memory
  llm_budget: 10                                    # LLM budget in USD
  additional_env:
    # Override CRS defaults here. Available models:
    #   claude-opus-4-6, claude-opus-4-5-20251101, claude-opus-4-1-20250805,
    #   claude-sonnet-4-5-20250929, claude-sonnet-4-20250514, claude-haiku-4-5-20251001
    CRS_AGENT: claude_code
    ANTHROPIC_MODEL: claude-sonnet-4-5-20250929
    CLAUDE_CODE_SUBAGENT_MODEL: claude-sonnet-4-5-20250929
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-sonnet-4-5-20250929
    ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-5-20250929
    ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-sonnet-4-5-20250929
    # AGENT_TIMEOUT: "3600"                          # Optional: seconds, 0 = no limit (default)

# --- LLM Configuration -----------------------------------------------------
llm_config:
  litellm_config: /path/to/sample-litellm-config.yaml  # UPDATE: path to litellm config
