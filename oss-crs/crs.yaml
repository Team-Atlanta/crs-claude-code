name: crs-claude-code
type:
  - bug-fixing
version: cli-2.0.17
docker_registry: ghcr.io/team-atlanta/crs-claude-code

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  patcher:
    dockerfile: oss-crs/patcher.Dockerfile
    additional_env:
      # Default values. To override, set additional_env in compose yaml.
      CRS_AGENT: claude_code
      # CLAUDE_CODE_CLI_VERSION: "2.1.42"  # Optional prepare-phase override for base image build
      # ANTHROPIC_MODEL: claude-opus-4-6
      # CLAUDE_CODE_SUBAGENT_MODEL: claude-sonnet-4-6
      # ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
      # ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
      # ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)

supported_target:
  mode:
    - full
    - delta
  language:  # language-agnostic — agent edits source, builder sidecar handles compilation
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - claude-opus-4-6
  - claude-haiku-4-5-20251001
  - claude-sonnet-4-6
