name: crs-claude-code
type:
  - bug-fixing
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/crs-claude-code

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src
  - name: inc-builder-asan
    snapshot: true
    dockerfile: oss-crs-infra:default-builder
    additional_env:
      SANITIZER: address

crs_run_phase:
  patcher:
    dockerfile: oss-crs/patcher.Dockerfile
    additional_env:
      # Set via compose yaml additional_env.
      CRS_AGENT: claude_code
      # ANTHROPIC_MODEL: claude-sonnet-4-5-20250929
      # CLAUDE_CODE_SUBAGENT_MODEL: claude-sonnet-4-5-20250929
      # ANTHROPIC_DEFAULT_OPUS_MODEL: claude-sonnet-4-5-20250929
      # ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-5-20250929
      # ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-sonnet-4-5-20250929
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)
  inc-builder-asan:
    run_snapshot: true
    dockerfile: oss-crs-infra:default-builder

supported_target:
  mode:
    - full
    - delta
  language:  # language-agnostic — agent edits source, builder sidecar handles compilation
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - claude-haiku-4-5-20251001
#  - claude-opus-4-5-20251101
#  - claude-sonnet-4-5-20250929
#  - claude-haiku-4-5-20251001
