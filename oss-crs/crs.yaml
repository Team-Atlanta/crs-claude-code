name: crs-claude-code
type:
  - bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/crs-claude-code

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  seed-generator:
    dockerfile: oss-crs/seed-generator.Dockerfile
    additional_env:
      CRS_AGENT: claude_code
      # ANTHROPIC_MODEL: claude-sonnet-4-6
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)
  fuzzer:
    run_fuzzer: true
    dockerfile: oss-crs-infra:default-fuzzer

supported_target:
  mode:
    - full
  language:
    - c
    - c++
  sanitizer:
    - address
    - undefined
  architecture:
    - x86_64

required_llms:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - claude-haiku-4-5-20251001
