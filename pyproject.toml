[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-claude-code"
version = "1.0.0"
description = "CRS using Claude Code CLI for autonomous vulnerability patching"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
run_patcher = "patcher:main"
run_seed_generator = "seed_generator:main"

[tool.setuptools]
py-modules = ["patcher", "seed_generator"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*"]

[tool.setuptools.package-data]
agents = ["*.md"]
